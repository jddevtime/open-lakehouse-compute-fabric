name: Bug report
description: Something does not work as documented
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include secrets, tokens or customer data.** Security problems must not be filed here: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: OLCF version
      description: Output of `olcf version`
      placeholder: "olcf: 0.1.0"
    validations: {required: true}
  - type: dropdown
    id: install
    attributes:
      label: How was it installed?
      options: ["One-line installer", "uv / pip wheel", "Docker Compose", "Helm / Kubernetes", "From source", "Other"]
    validations: {required: true}
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "macOS 15 arm64 without Xcode Command Line Tools / Ubuntu 24.04 x86_64 / Windows 11"
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Installer / CLI", "Web console", "Compute / workers / Spark", "Runtimes", "Notebooks / environments", "Lakehouse / SQL / dashboards", "Pipelines / triggers / alerts", "Microsoft Fabric integration", "MCP / AI agents", "Identity / security", "Backup / upgrade / operations", "Documentation", "Other"]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands or clicks that shows the problem.
      render: shell
    validations: {required: true}
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics
      description: Redacted output of `olcf doctor --server` and any error text including its `correlation_id`. A support bundle (`olcf diagnostics`) is redacted by default; review it before attaching.
      render: text
