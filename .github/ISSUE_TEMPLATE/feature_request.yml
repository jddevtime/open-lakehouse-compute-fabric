name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the requirements traceability document (`docs/compliance/requirements-traceability.md`) first: the feature may already be listed as implemented, deferred or out of scope with a reason.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: contract
    attributes:
      label: Does it change a public contract (REST API, worker protocol, capsule, plug-in interface)?
      options: ["No", "Yes", "Not sure"]
    validations: {required: true}
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to work on this and open a pull request
