<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d"><title id="t">Three ways to run OLCF</title><desc id="d">Standalone on one machine, a multi-machine Spark fabric, or extending Microsoft Fabric</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb0d0"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14213d"/></linearGradient></defs><rect width="1280" height="520" rx="18" fill="url(#g)"/><text x="640.0" y="44" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#e8eefb" font-weight="700" text-anchor="middle" >Start on a laptop. Grow into a fabric. Plug in Microsoft Fabric when you want to.</text><rect x="28" y="80" width="392" height="400" rx="16" fill="#2dd4bf" fill-opacity="0.07" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.5"/><text x="46" y="108" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#2dd4bf" font-weight="700" text-anchor="start" letter-spacing="1.2">1  STANDALONE</text><text x="46" y="132" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cbd8f2" font-weight="500" text-anchor="start" >One machine, nothing else needed</text><rect x="444" y="80" width="392" height="400" rx="16" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/><text x="462" y="108" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#fbbf24" font-weight="700" text-anchor="start" letter-spacing="1.2">2  MULTI-MACHINE FABRIC</text><text x="462" y="132" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cbd8f2" font-weight="500" text-anchor="start" >Every machine is a worker</text><rect x="860" y="80" width="392" height="400" rx="16" fill="#60a5fa" fill-opacity="0.07" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/><text x="878" y="108" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#60a5fa" font-weight="700" text-anchor="start" letter-spacing="1.2">3  FABRIC-EXTENDED</text><text x="878" y="132" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cbd8f2" font-weight="500" text-anchor="start" >Your Spark runs Fabric notebooks</text><rect x="52" y="150" width="344" height="56" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="224.0" y="183.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#e8eefb" font-weight="600" text-anchor="middle" >Browser, olcf CLI, Python SDK, AI agent</text><rect x="52" y="236" width="344" height="90" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="224.0" y="275.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >OLCF server + embedded worker</text><text x="224.0" y="294.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >console, SQL, notebooks, pipelines</text><text x="224.0" y="309.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >sample Retail lakehouse included</text><rect x="52" y="356" width="344" height="56" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="224.0" y="389.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Local disk: Delta tables</text><line x1="224" y1="206" x2="224" y2="236" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="224" y1="326" x2="224" y2="356" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="224" y="446" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600" text-anchor="middle" >olcf quickstart  -  no Spark, no Fabric, no cloud</text><rect x="468" y="150" width="344" height="56" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="640.0" y="172.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Control plane (1 or more nodes)</text><text x="640.0" y="191.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >PostgreSQL for HA</text><rect x="484" y="238" width="46" height="34" rx="6" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><rect x="490" y="246" width="34" height="5" rx="2" fill="#fbbf24" fill-opacity="0.45"/><rect x="490" y="256" width="22" height="5" rx="2" fill="#fbbf24" fill-opacity="0.25"/><circle cx="521" cy="259" r="3.5" fill="#34d399"/><text x="507" y="288" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="500" text-anchor="middle" >server</text><rect x="566" y="238" width="46" height="34" rx="6" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><rect x="572" y="246" width="34" height="5" rx="2" fill="#fbbf24" fill-opacity="0.45"/><rect x="572" y="256" width="22" height="5" rx="2" fill="#fbbf24" fill-opacity="0.25"/><circle cx="603" cy="259" r="3.5" fill="#34d399"/><text x="589" y="288" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="500" text-anchor="middle" >VM</text><rect x="648" y="238" width="46" height="34" rx="6" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><rect x="654" y="246" width="34" height="5" rx="2" fill="#fbbf24" fill-opacity="0.45"/><rect x="654" y="256" width="22" height="5" rx="2" fill="#fbbf24" fill-opacity="0.25"/><circle cx="685" cy="259" r="3.5" fill="#34d399"/><text x="671" y="288" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="500" text-anchor="middle" >rack</text><rect x="730" y="238" width="46" height="34" rx="6" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><rect x="736" y="246" width="34" height="5" rx="2" fill="#fbbf24" fill-opacity="0.45"/><rect x="736" y="256" width="22" height="5" rx="2" fill="#fbbf24" fill-opacity="0.25"/><circle cx="767" cy="259" r="3.5" fill="#34d399"/><text x="753" y="288" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="500" text-anchor="middle" >cloud</text><rect x="468" y="310" width="344" height="56" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="640.0" y="343.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Spark Standalone across the machines</text><rect x="468" y="384" width="344" height="38" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="640.0" y="408.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#e8eefb" font-weight="600" text-anchor="middle" >S3, MinIO, ADLS, local</text><line x1="640" y1="206" x2="640" y2="238" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="640" y1="292" x2="640" y2="310" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="640" y1="366" x2="640" y2="384" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><text x="640" y="446" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#fbbf24" font-weight="600" text-anchor="middle" >olcf worker enrol  -  machines connect outward</text><rect x="884" y="150" width="344" height="56" rx="12" fill="#121c33" stroke="#60a5fa" stroke-width="1.6"/><text x="1056.0" y="183.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Fabric notebook: olcf.run_remote()</text><rect x="884" y="236" width="344" height="56" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="1056.0" y="258.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >OLCF control plane + analyzer</text><text x="1056.0" y="277.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >signed capsule, single-use nonce</text><rect x="884" y="322" width="344" height="56" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="1056.0" y="355.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Your Spark workers</text><rect x="884" y="398" width="344" height="30" rx="12" fill="#121c33" stroke="#60a5fa" stroke-width="1.6"/><text x="1056.0" y="418.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#e8eefb" font-weight="600" text-anchor="middle" >OneLake, direct</text><line x1="1056" y1="206" x2="1056" y2="236" stroke="#60a5fa" stroke-width="2" marker-end="url(#arb)"/><line x1="1056" y1="292" x2="1056" y2="322" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="1056" y1="378" x2="1056" y2="398" stroke="#fbbf24" stroke-width="2" marker-end="url(#ara)"/><text x="1056" y="450" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#60a5fa" font-weight="600" text-anchor="middle" >attach the olcf_fabric wheel to a Fabric Environment</text><text x="640.0" y="506" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#9fb0d0" font-weight="400" text-anchor="middle" >The same server and the same console in all three. Fabric is an adapter, not a dependency.</text></svg>