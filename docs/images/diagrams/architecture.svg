ols itself with the control plane.</text><rect x="28" y="500" width="900" height="130" rx="16" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/><text x="46" y="528" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#fbbf24" font-weight="700" text-anchor="start" letter-spacing="1.2">WORKER FLEET  -  machines connect outward</text><rect x="52" y="540" width="46" height="34" rx="6" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><rect x="58" y="548" width="34" height="5" rx="2" fill="#fbbf24" fill-opacity="0.45"/><rect x="58" y="558" width="22" height="5" rx="2" fill="#fbbf24" fill-opacity="0.25"/><circle cx="89" cy="561" r="3.5" fill="#34d399"/><text x="75" y="590" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="500" text-anchor="middle" >worker A</text><text x="75" y="612" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#9fb0d0" font-weight="400" text-anchor="middle" >runtimes 2.0 + 1.3</text><rect x="172" y="540" width="46" height="34" rx="6" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><rect x="178" y="548" width="34" height="5" rx="2" fill="#fbbf24" fill-opacity="0.45"/><rect x="178" y="558" width="22" height="5" rx="2" fill="#fbbf24" fill-opacity="0.25"/><circle cx="209" cy="561" r="3.5" fill="#34d399"/><text x="195" y="590" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="500" text-anchor="middle" >worker B</text><text x="195" y="612" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#9fb0d0" font-weight="400" text-anchor="middle" >runtime 2.0</text><rect x="292" y="540" width="46" height="34" rx="6" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><rect x="298" y="548" width="34" height="5" rx="2" fill="#fbbf24" fill-opacity="0.45"/><rect x="298" y="558" width="22" height="5" rx="2" fill="#fbbf24" fill-opacity="0.25"/><circle cx="329" cy="561" r="3.5" fill="#34d399"/><text x="315" y="590" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="500" text-anchor="middle" >worker C</text><text x="315" y="612" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#9fb0d0" font-weight="400" text-anchor="middle" >runtime 1.3</text><rect x="420" y="540" width="484" height="70" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="662.0" y="569.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="600" text-anchor="middle" >Spark Standalone + Host Python</text><text x="662.0" y="588.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >driver and executors across machines; Python notebooks and DuckDB without Spark</text><line x1="394" y1="432" x2="394" y2="500" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ara)" marker-start="url(#ara)"/><text x="404" y="470" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#fbbf24" font-weight="600" text-anchor="start" >outbound WebSocket, mTLS optional</text><rect x="952" y="500" width="300" height="130" rx="16" fill="#60a5fa" fill-opacity="0.07" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/><text x="970" y="528" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#60a5fa" font-weight="700" text-anchor="start" letter-spacing="1.2">OPTIONAL: MICROSOFT FABRIC</text><text x="1102" y="560" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#cbd8f2" font-weight="500" text-anchor="middle" >Fabric notebooks call run_remote()</text><text x="1102" y="580" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#cbd8f2" font-weight="500" text-anchor="middle" >Intelligence can scan the tenant</text><text x="1102" y="600" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#cbd8f2" font-weight="500" text-anchor="middle" >and Power BI (read-only)</text><line x1="1120" y1="328" x2="1120" y2="500" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arb)" marker-start="url(#arb)"/><text x="1130" y="420" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#60a5fa" font-weight="600" text-anchor="start" >run_remote capsule, tenant scans</text><rect x="28" y="654" width="1224" height="112" rx="16" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/><text x="46" y="682" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#34d399" font-weight="700" text-anchor="start" letter-spacing="1.2">DATA PLANE  -  executors and drivers read and write directly</text><rect x="52" y="692" width="264" height="56" rx="12" fill="#121c33" stroke="#34d399" stroke-width="1.6"/><text x="184.0" y="714.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Local disk</text><text x="184.0" y="733.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >Delta, Parquet</text><rect x="348" y="692" width="264" height="5