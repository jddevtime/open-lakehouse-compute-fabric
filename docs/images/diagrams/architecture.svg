ystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="600" text-anchor="middle" >Intelligence</text><text x="878.0" y="303.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >discovery, lineage, glossary,</text><text x="878.0" y="318.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >governance (observe-only)</text><rect x="1008" y="252" width="224" height="76" rx="12" fill="#121c33" stroke="#60a5fa" stroke-width="1.6"/><text x="1120.0" y="284.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="600" text-anchor="middle" >Fabric adapter</text><text x="1120.0" y="303.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >analyzer, capsule,</text><text x="1120.0" y="318.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >diagnostics</text><rect x="40" y="372" width="224" height="60" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="152.0" y="396.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Metadata DB</text><text x="152.0" y="415.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >SQLite or PostgreSQL</text><rect x="282" y="372" width="224" height="60" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="394.0" y="396.0" font-family=