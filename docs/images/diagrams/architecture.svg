<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d"><title id="t">OLCF architecture</title><desc id="d">Clients call the control plane; machines in the worker fleet connect outward to it and read and write data directly; Intelligence observes the platform and, optionally, a Fabric tenant</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb0d0"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14213d"/></linearGradient></defs><rect width="1280" height="800" rx="18" fill="url(#g)"/><text x="640.0" y="40" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#e8eefb" font-weight="700" text-anchor="middle" >Architecture</text><rect x="40" y="64" width="216" height="64" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="148.0" y="90.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Web console</text><text x="148.0" y="109.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >Preact, no build step</text><line x1="148" y1="128" x2="148" y2="150" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ar)"/><rect x="284" y="64" width="216" height="64" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="392.0" y="90.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >olcf CLI</text><text x="392.0" y="109.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >every feature scriptable</text><line x1="392" y1="128" x2="392" y2="150" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ar)"/><rect x="528" y="64" width="216" height="64" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="636.0" y="90.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Python SDK</text><text x="636.0" y="109.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >olcf.sdk</text><line x1="636" y1="128" x2="636" y2="150" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ar)"/><rect x="772" y="64" width="216" height="64" rx="12" fill="#121c33" stroke="#60a5fa" stroke-width="1.6"/><text x="880.0" y="90.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Fabric notebook</text><text x="880.0" y="109.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >olcf_fabric SDK</text><line x1="880" y1="128" x2="880" y2="150" stroke="#60a5fa" stroke-width="2" marker-end="url(#ar)"/><rect x="1016" y="64" width="216" height="64" 