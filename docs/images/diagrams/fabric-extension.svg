<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="t d"><title id="t">How OLCF extends Microsoft Fabric</title><desc id="d">A Fabric notebook sends itself as a signed capsule to the OLCF control plane, which runs it on your own Spark workers; workers read and write OneLake directly and the status flows back to the notebook</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb0d0"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14213d"/></linearGradient></defs><rect width="1280" height="760" rx="18" fill="url(#g)"/><text x="640.0" y="44" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#e8eefb" font-weight="700" text-anchor="middle" >Extend Microsoft Fabric to the compute you own</text><text x="640.0" y="70" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9fb0d0" font-weight="400" text-anchor="middle" >one call from the notebook: olcf.run_remote()</text><rect x="30" y="96" width="330" height="540" rx="16" fill="#60a5fa" fill-opacity="0.07" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/><text x="48" y="124" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#60a5fa" font-weight="700" text-anchor="start" letter-spacing="1.2">MICROSOFT FABRIC  (cloud)</text><rect x="400" y="96" width="400" height="540" rx="16" fill="#2dd4bf" fill-opacity="0.07" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.5"/><text x="418" y="124" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#2dd4bf" font-weight="700" text-anchor="start" letter-spacing="1.2">OLCF CONTROL PLANE  (your network)</text><rect x="840" y="96" width="410" height="540" rx="16" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/><text x="858" y="124" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#fbbf24" font-weight="700" text-anchor="start" letter-spacing="1.2">YOUR COMPUTE  (on-prem / VM / Kubernetes)</text><rect x="58" y="146" width="274" height="84" rx="12" fill="#121c33" stroke="#60a5fa" stroke-width="1.6"/><text x="195.0" y="182.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Fabric notebook</text><text x="195.0" y="201.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >import olcf_fabric as olcf</text><text x="195.0" y="216.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >olcf.run_remote()</text><rect x="58" y="262" width="274" height="62" rx="12" fill="#121c33" stroke="#60a5fa" stroke-width="1.6"/><text x="195.0" y="287.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Fabric pipeline</text><text x="195.0" y="306.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >notebook activity sees the exit value</text><rect x="58" y="366" width="274" height="62" rx="12" fill="#121c33" stroke="#60a5fa" stroke-width="1.6"/><text x="195.0" y="391.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Microsoft Entra ID</text><text x="195.0" y="410.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >tenant, workspace and token scoping</text><rect x="58" y="470" width="274" height="84" rx="12" fill="#121c33" stroke="#60a5fa" stroke-width="1.6"/><text x="195.0" y="506.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >OneLake / ADLS Gen2</text><text x="195.0" y="525.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >Lakehouse Files and Tables</text><text x="195.0" y="540.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >Delta, direct abfss access</text><rect x="428" y="146" width="344" height="62" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="600.0" y="171.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Fabric adapter</text><text x="600.0" y="190.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >validate, challenge, verify capsule</text><rect x="428" y="230" width="344" height="62" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="600.0" y="255.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Compatibility analyzer</text><text x="600.0" y="274.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >73 rules, shims, blockers rejected up front</text><rect x="428" y="314" width="344" height="62" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="600.0" y="339.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Scheduler and job service</text><text x="600.0" y="358.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >placement, queue, retries, cancel</text><rect x="428" y="398" width="344" height="62" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="600.0" y="423.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Worker hub</text><text x="600.0" y="442.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >workers dial in (outbound WebSocket)</text><rect x="428" y="482" width="160" height="62" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="508.0" y="507.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Metadata DB</text><text x="508.0" y="526.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >SQLite / PostgreSQL</text><rect x="612" y="482" width="160" height="62" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="692.0" y="507.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Audit and RBAC</text><text x="692.0" y="526.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >tamper-evident log</text><text x="600" y="584" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#9fb0d0" font-weight="500" text-anchor="middle" >Console, REST API, CLI, MCP endpoint</text><text x="600" y="604" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >Nothing here needs inbound access to your workers.</text><rect x="884" y="146" width="46" height="34" rx="6" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><rect x="890" y="154" width="34" height="5" rx="2" fill="#2dd4bf" fill-opacity="0.45"/><rect x="890" y="164" width="22" height="5" rx="2" fill="#2dd4bf" fill-opacity="0.25"/><circle cx="921" cy="167" r="3.5" fill="#34d399"/><text x="907" y="196" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="500" text-anchor="middle" >worker A</text><rect x="990" y="146" width="46" height="34" rx="6" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><rect x="996" y="154" width="34" height="5" rx="2" fill="#2dd4bf" fill-opacity="0.45"/><rect x="996" y="164" width="22" height="5" rx="2" fill="#2dd4bf" fill-opacity="0.25"/><circle cx="1027" cy="167" r="3.5" fill="#34d399"/><text x="1013" y="196" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="500" text-anchor="middle" >worker B</text><rect x="1096" y="146" width="46" height="34" rx="6" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><rect x="1102" y="154" width="34" height="5" rx="2" fill="#2dd4bf" fill-opacity="0.45"/><rect x="1102" y="164" width="22" height="5" rx="2" fill="#2dd4bf" fill-opacity="0.25"/><circle cx="1133" cy="167" r="3.5" fill="#34d399"/><text x="1119" y="196" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="500" text-anchor="middle" >worker C</text><rect x="868" y="224" width="366" height="78" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="1051.0" y="257.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Spark Standalone cluster</text><text x="1051.0" y="276.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >driver and executors across machines</text><text x="1051.0" y="291.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >immutable signed runtimes, side by side</text><rect x="868" y="330" width="170" height="62" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="953.0" y="355.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Host Python</text><text x="953.0" y="374.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >notebooks without Spark</text><rect x="1064" y="330" width="170" height="62" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="1149.0" y="355.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >DuckDB / delta-rs</text><text x="1149.0" y="374.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >SQL and table reads</text><rect x="868" y="420" width="366" height="62" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="1051.0" y="445.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Local, S3, MinIO, ADLS</text><text x="1051.0" y="464.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9fb0d0" font-weight="400" text-anchor="middle" >your own storage works the same way</text><line x1="332" y1="190" x2="428" y2="177" stroke="#2dd4bf" stroke-width="2.6" marker-end="url(#art)"/><text x="380" y="154" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#2dd4bf" font-weight="700" text-anchor="middle" >signed capsule</text><text x="380" y="167" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#2dd4bf" font-weight="700" text-anchor="middle" >over HTTPS</text><line x1="428" y1="345" x2="332" y2="300" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arb)"/><text x="380" y="364" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#60a5fa" font-weight="600" text-anchor="middle" >status, logs,</text><text x="380" y="378" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#60a5fa" font-weight="600" text-anchor="middle" >exit value</text><line x1="600" y1="208" x2="600" y2="230" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="600" y1="292" x2="600" y2="314" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="600" y1="376" x2="600" y2="398" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="772" y1="429" x2="868" y2="263" stroke="#2dd4bf" stroke-width="2.4" marker-end="url(#art)" marker-start="url(#art)"/><text x="838" y="350" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#2dd4bf" font-weight="700" text-anchor="middle" transform="rotate(-61 838 350)">outbound</text><line x1="1051" y1="302" x2="1051" y2="330" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="1051" y1="392" x2="1051" y2="420" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><path d="M 1051 482 V 660 Q 1051 690 1021 690 H 225 Q 195 690 195 660 V 556" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ara)" marker-start="url(#ara)"/><text x="640.0" y="716" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle" >direct reads and writes: executors talk to OneLake themselves, data never detours through the control plane</text><text x="640.0" y="744" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#9fb0d0" font-weight="400" text-anchor="middle" >Fabric is an adapter, not the core: every part of this runs without a Microsoft subscription.</text></svg>