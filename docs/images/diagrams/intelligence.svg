<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d"><title id="t">OLCF Intelligence</title><desc id="d">Sources feed connectors and analyzers, which build one asset graph with stable ids, confidence and gaps; the graph serves catalog, lineage, glossary and governance through the console, REST, CLI, SDK and MCP</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb0d0"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14213d"/></linearGradient></defs><rect width="1280" height="640" rx="18" fill="url(#g)"/><text x="640.0" y="42" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#e8eefb" font-weight="700" text-anchor="middle" >OLCF Intelligence: what do we have, where does it come from, what depends on it, who owns it</text><rect x="28" y="70" width="300" height="520" rx="16" fill="#60a5fa" fill-opacity="0.07" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/><text x="46" y="98" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#60a5fa" font-weight="700" text-anchor="start" letter-spacing="1.2">READS</text><rect x="48" y="112" width="260" height="98" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="178.0" y="155.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="600" text-anchor="middle" >This installation</text><text x="178.0" y="174.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >workspaces, lakehouses, tables,</text><text x="178.0" y="189.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >notebooks, pipelines, saved SQL,</text><text x="178.0" y="204.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >reports and dashboards</text><rect x="48" y="230" width="260" height="98" rx="12" fill="#121c33" stroke="#60a5fa" stroke-width="1.6"/><text x="178.0" y="273.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="600" text-anchor="middle" >Microsoft Fabric tenant</text><text x="178.0" y="292.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >optional: Fabric REST, definitions,</text><text x="178.0" y="307.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >Delta log through OneLake,</text><text x="178.0" y="322.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >Power BI admin scanner</text><rect x="48" y="348" width="260" height="98" rx="12" fill="#121c33" stroke="#60a5fa" stroke-width="1.6"/><text x="178.0" y="391.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="600" text-anchor="middle" >Saved scanner file</text><text x="178.0" y="410.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >import a Power BI scanner</text><text x="178.0" y="425.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >result without any connection</text><rect x="48" y="466" width="260" height="98" rx="12" fill="#121c33" stroke="#34d399" stroke-width="1.6"/><text x="178.0" y="509.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="600" text-anchor="middle" >Run-time events</text><text x="178.0" y="528.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >dataset.read / written / statement</text><text x="178.0" y="543.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >from real jobs, notebooks, SQL</text><rect x="372" y="70" width="536" height="520" rx="16" fill="#2dd4bf" fill-opacity="0.07" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.5"/><text x="390" y="98" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#2dd4bf" font-weight="700" text-anchor="start" letter-spacing="1.2">ENGINE  (a module over the unchanged catalog)</text><rect x="392" y="112" width="496" height="82" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="640.0" y="147.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="600" text-anchor="middle" >Connectors and scans</text><text x="640.0" y="166.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >facts and definitions; incremental, resumable, leased;</text><text x="640.0" y="181.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >partial scans never remove anything</text><rect x="392" y="224" width="496" height="112" rx="12" fill="#121c33" stroke="#a78bfa" stroke-width="1.6"/><text x="640.0" y="274.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Lineage analyzers (pure, deterministic, never run your code)</text><text x="640.0" y="293.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >SQL, PySpark/Python, notebooks, OLCF and Fabric pipelines,</text><text x="640.0" y="308.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >Spark job definitions, semantic models (TMDL, DAX, M),</text><text x="640.0" y="323.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >Power BI reports (PBIR), scanner results</text><rect x="392" y="366" width="496" height="120" rx="12" fill="#121c33" stroke="#a78bfa" stroke-width="1.6"/><text x="640.0" y="420.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Asset graph</text><text x="640.0" y="439.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >stable ast_ ids with aliases (the same table is one asset</text><text x="640.0" y="454.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >whoever names it); edges carry evidence and a confidence:</text><text x="640.0" y="469.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >verified (run-time) - derived - inferred - unknown</text><rect x="392" y="512" width="496" height="56" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="640.0" y="545.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#e8eefb" font-weight="600" text-anchor="middle" >Gaps: what could not be seen, why, and the fix</text><line x1="308" y1="160" x2="392" y2="153" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="308" y1="276" x2="392" y2="160" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="308" y1="394" x2="392" y2="168" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="308" y1="512" x2="392" y2="428" stroke="#34d399" stroke-width="2" marker-end="url(#ar)"/><line x1="640" y1="194" x2="640" y2="224" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="640" y1="336" x2="640" y2="366" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="640" y1="486" x2="640" y2="512" stroke="#fbbf24" stroke-width="2" marker-end="url(#ara)"/><rect x="952" y="70" width="300" height="520" rx="16" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/><text x="970" y="98" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#a78bfa" font-weight="700" text-anchor="start" letter-spacing="1.2">SERVES</text><rect x="972" y="112" width="260" height="78" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="1102.0" y="145.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Catalog and search</text><text x="1102.0" y="164.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >assets, columns, owners</text><rect x="972" y="206" width="260" height="78" rx="12" fill="#121c33" stroke="#a78bfa" stroke-width="1.6"/><text x="1102.0" y="239.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Lineage and impact</text><text x="1102.0" y="258.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >table and column level</text><rect x="972" y="300" width="260" height="78" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="1102.0" y="333.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Glossary and domains</text><text x="1102.0" y="352.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >terms, data products, owners</text><rect x="972" y="394" width="260" height="78" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="1102.0" y="427.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Governance</text><text x="1102.0" y="446.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >classification review, certification,</text><text x="1102.0" y="461.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >policies, quality (observe-only)</text><rect x="972" y="488" width="260" height="78" rx="12" fill="#121c33" stroke="#60a5fa" stroke-width="1.6"/><text x="1102.0" y="521.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e8eefb" font-weight="600" text-anchor="middle" >Console, REST, CLI, SDK, MCP</text><text x="1102.0" y="540.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9fb0d0" font-weight="400" text-anchor="middle" >the same answers everywhere</text><line x1="888" y1="426" x2="972" y2="340" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><text x="640.0" y="622" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#9fb0d0" font-weight="400" text-anchor="middle" >A failure in Intelligence never stops compute. Sampling is off unless you turn it on. Governance reports; it does not enforce.</text></svg>