ystem,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="400" text-anchor="middle" >browse, describe</text><rect x="446" y="184" width="160" height="56" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="526.0" y="206.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Read-only SQL</text><text x="526.0" y="225.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="400" text-anchor="middle" >guarded, per call</text><rect x="446" y="256" width="160" height="56" rx="12" fill="#121c33" stroke="#2dd4bf" stroke-width="1.6"/><text x="526.0" y="278.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="600" text-anchor="middle" >Jobs and logs</text><text x="526.0" y="297.0" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="400" text-anchor="middle" >status, results</text><line x1="212" y1="147" x2="244" y2="185" stroke="#a78bfa" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="212" y1="247" x2="244" y2="215" stroke="#a78bfa" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="414" y1="195" x2="446" y2="140" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="414" y1="195" x2="446" y2="212" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><line x1="414" y1="195" x2="446" y2="284" stroke="#9fb0d0" stroke-width="2" marker-end="url(#ar)"/><text x="328" y="350" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#a78bfa" font-weight="600" text-anchor="middle" >olcf mcp config --client claude-code</text><text x="328" y="376" font-