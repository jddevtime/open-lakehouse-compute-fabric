nt-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fb0d0" font-weight="400" text-anchor="start" >one pytest run per tests/ directory, gates in CI</text><rect x="676" y="310" width="552" height="54" rx="12" fill="#121c33" stroke="#fbbf24" stroke-width="1.6"/><text x="696" y="334" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e8eefb" font-weight="700" text-anchor="start" >Open work</text><text x="696" y="353" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fb0d0" font-weight="400" text-anchor="start" >release-readiness checklist: acceptance work</text><text x="640.0" y="424" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#9fb0d0" font-weight="400" text-anchor="middle" >Fork it, point your agent at it, open a pull request. Every change needs a failing test first and a green gate.</text></svg>