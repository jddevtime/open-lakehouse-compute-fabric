<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d"><title id="t">AI agents and OLCF</title><desc id="d">AI agents connect over MCP with exactly the permissions of the person who created the token, and can also contribute to the code base</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb0d0"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14213d"/></linearGradient></defs><rect width="1280" height="440" rx="18" fill="url(#g)"/><text x="640.0" y="42" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="23" fill="#e8eefb" font-weight="700" text-anchor="middle" >Built to be used, and extended, by people and by AI agents</text><rect x="28" y="70" width="600" height="330" rx="16" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/><text x="46" y="98" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#a78bfa" font-weight="700" text-anchor="start" letter-spacing="1.2">USE IT: MCP ENDPOINT</text><rect x="52" y="112" width="160" height="70" rx="12" fill="#121c33" stroke="#a78bfa" stroke-width="1.6"/><text x="132.0" y="141.0" font-family="'Segoe UI',-apple-syst