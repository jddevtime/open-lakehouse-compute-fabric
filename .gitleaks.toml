# Gitleaks configuration (used by .github/workflows/security.yml and by `gitleaks dir . --config .gitleaks.toml`).
# The default rule set stays fully enabled.  Tests and application source are NOT excluded: a real credential committed to a test file must still be found.
# Synthetic credentials in test fixtures are annotated one line at a time with a trailing `# gitleaks:allow` comment instead.
title = "OLCF gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "generated bytecode and the intentionally public development signing key"
# Generated Python bytecode is never committed (see .gitignore) but exists in working copies, and a compiled test module embeds its fixture strings.
paths = [
  '''(^|/)__pycache__/''',
  '''\.pyc$''',
]
# The development runtime-signing key is public by design (src/olcf/runtime/keys/README.md): it only proves a manifest was not altered by accident, and a
# production installation does not trust it.  Allowed by its exact key material (not by path), so any other key is still reported.
regexes = [
  '''MC4CAQAwBQYDK2VwBCIEIDsz84rOSZ1emBx1hfNHEqOuPkl/ADM5EJZwuyjRAKL3''',
]
