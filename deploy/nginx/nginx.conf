# Alternative to Caddy: nginx TLS terminator for OLCF.  Mount your certificate at /etc/nginx/tls/{fullchain.pem,privkey.pem}.
# Not wired into docker-compose.yml; use it as   docker run -p 443:443 -v ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro -v ./tls:/etc/nginx/tls:ro nginx:stable-alpine
# Set OLCF's server.trusted_proxies = 1 (OLCF_SERVER__TRUSTED_PROXIES=1) so that client addresses in logs and rate limits are the real ones.
worker_processes auto;
events { worker_connections 4096; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server_tokens off;
  client_max_body_size 512m;
  upstream olcf { server olcf:8470; keepalive 32; }    # cluster profile: server control-plane:8470 and proxy_pass https://
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    location / {
      proxy_pass http://olcf;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }
}
