{{- if not .Values.secrets.existingSecret }}
{{- $name := include "olcf.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "olcf.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep          # losing the master key makes every stored secret unreadable: never delete it with the release
type: Opaque
data:
  master-key: {{ if hasKey $data "master-key" }}{{ index $data "master-key" }}{{ else }}{{ randBytes 32 | b64enc }}{{ end }}
  jwt-signing-key: {{ if hasKey $data "jwt-signing-key" }}{{ index $data "jwt-signing-key" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{ .Values.secrets.adminPasswordKey }}: {{ if .Values.secrets.adminPassword }}{{ .Values.secrets.adminPassword | b64enc }}{{ else if hasKey $data .Values.secrets.adminPasswordKey }}{{ index $data .Values.secrets.adminPasswordKey }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
---
{{- if and (not .Values.database.external.existingSecret) (or .Values.database.external.url .Values.database.bundled.enabled) }}
{{- $dbname := include "olcf.dbSecretName" . }}
{{- $dbexisting := lookup "v1" "Secret" .Release.Namespace $dbname }}
{{- $dbdata := dict }}
{{- if $dbexisting }}{{ $dbdata = $dbexisting.data }}{{ end }}
{{- $pgpass := "" }}
{{- if hasKey $dbdata "postgres-password" }}{{ $pgpass = index $dbdata "postgres-password" | b64dec }}{{ else }}{{ $pgpass = randAlphaNum 32 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbname }}
  labels:
    {{- include "olcf.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.database.bundled.enabled }}
  postgres-password: {{ $pgpass | b64enc }}
  {{ .Values.database.external.existingSecretKey }}: {{ printf "postgresql+psycopg://olcf:%s@%s-postgres:5432/olcf" $pgpass (include "olcf.fullname" .) | b64enc }}
  {{- else }}
  {{ .Values.database.external.existingSecretKey }}: {{ .Values.database.external.url | b64enc }}
  {{- end }}
{{- end }}
