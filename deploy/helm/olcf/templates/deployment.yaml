{{- $hasDb := or .Values.database.external.url .Values.database.external.existingSecret .Values.database.bundled.enabled }}
{{- if and (gt (int .Values.controlPlane.replicaCount) 1) (not $hasDb) }}
{{- fail "controlPlane.replicaCount > 1 needs PostgreSQL: set database.external.url / database.external.existingSecret (or database.bundled.enabled for a demo)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olcf.fullname" . }}
  labels:
    {{- include "olcf.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  revisionHistoryLimit: 5
  {{- if eq .Values.persistence.accessMode "ReadWriteOnce" }}
  strategy:
    type: Recreate                       # a ReadWriteOnce volume cannot be attached by the old and the new pod at once
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  {{- end }}
  selector:
    matchLabels:
      {{- include "olcf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "olcf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
        {{- with .Values.controlPlane.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ .Values.controlPlane | toYaml | sha256sum }}
        {{- with .Values.controlPlane.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "olcf.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.kubernetesProvider.enabled }}
      {{- include "olcf.pullSecrets" . | nindent 6 }}
      {{- if .Values.controlPlane.priorityClassName }}
      priorityClassName: {{ .Values.controlPlane.priorityClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: control-plane
          image: {{ include "olcf.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "olcf.fullname" . }}-config
          env:
            - name: OLCF_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "olcf.secretName" . }}
                  key: master-key
            - name: OLCF_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "olcf.secretName" . }}
                  key: jwt-signing-key
            - name: OLCF_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "olcf.secretName" . }}
                  key: {{ .Values.secrets.adminPasswordKey }}
            {{- if $hasDb }}
            - name: OLCF_DB__URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "olcf.dbSecretName" . }}
                  key: {{ .Values.database.external.existingSecretKey }}
            {{- end }}
            {{- if include "olcf.runtimeTrustEnabled" . }}
            - name: OLCF_RUNTIME_TRUST_DIR
              value: {{ .Values.runtimeTrust.mountPath | quote }}
            {{- end }}
            {{- with .Values.controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            exec:
              command: ["/opt/olcf/bin/python", "/usr/local/bin/olcf-healthcheck"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:      # /v1/health/ready: 503 (database down, or production trusting the development runtime key) removes the pod from the Service; liveness keeps the process
            exec:
              command: ["/opt/olcf/bin/python", "/usr/local/bin/olcf-healthcheck", "/v1/health/ready"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/opt/olcf/bin/python", "/usr/local/bin/olcf-healthcheck"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            {{- if include "olcf.runtimeTrustEnabled" . }}
            - name: runtime-trust
              mountPath: {{ .Values.runtimeTrust.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.controlPlane.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "olcf.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {sizeLimit: 2Gi}
        {{- if include "olcf.runtimeTrustEnabled" . }}
        {{- include "olcf.runtimeTrustVolume" . | nindent 8 }}
        {{- end }}
        {{- with .Values.controlPlane.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
