# Open Lakehouse Compute Fabric (OLCF) - build metadata.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "olcf"
version = "0.1.0"
description = "Open Lakehouse Compute Fabric: an open-source lakehouse platform with Microsoft Fabric Compute Extension."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Justin Dodrill" }]
keywords = ["lakehouse", "spark", "delta-lake", "iceberg", "microsoft-fabric", "onelake", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42",
  "croniter>=2.0",
  "jsonschema>=4.21",
  "duckdb>=1.1",
  "deltalake>=0.22",
  "pyarrow>=16",
  "psutil>=5.9",
  "click>=8.1",
  "pyyaml>=6.0",
  "websockets>=12",
  "nbformat>=5.10",
  "jupyter_client>=8.6",
  "ipykernel>=6.29",     # the kernel that runs notebooks on the host-Python runtime (olcf-host-python) and in the kernel host
  "pandas>=2.2",         # the sample notebook 02 (DuckDB .df()) and the host-Python runtime; pyarrow-backed, wheels for every supported platform
  "python-multipart>=0.0.9",
  "tomli-w>=1.0",
  "sqlglot>=25",
  "packaging>=24.0",     # imported at module level by compute, notebooks, runtime and ops
  "starlette>=0.40",     # imported directly by api/core (also a dependency of fastapi)
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
azure = ["azure-storage-file-datalake>=12.14", "azure-identity>=1.16"]
k8s = ["kubernetes>=29"]
keyring = ["keyring>=25"]
iceberg = ["pyiceberg>=0.7"]
ldap = ["ldap3>=2.9"]
sftp = ["paramiko>=3.4"]
zstd = ["zstandard>=0.22"]
plots = ["matplotlib>=3.8"]   # charts in the sample notebook; without it the notebook prints tables and says how to add it
all = ["olcf[postgres,s3,azure,k8s,keyring,iceberg,ldap,sftp,zstd,plots]"]
dev = [
  "pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "pytest-cov>=5",
  "moto[server]>=5", "hypothesis>=6", "playwright>=1.45", "mcp>=1.0", "ruff>=0.5", "mypy>=1.10",
  # tooling that the tests and scripts run as `python -m ...`: an environment made by `uv venv` has neither (environment publication and scripts/build_fabric_sdk.sh need them)
  "pip>=23.1", "setuptools>=70.1",
  "olcf[all]",
]

[project.urls]
Homepage = "https://github.com/jddevtime/open-lakehouse-compute-fabric"
Documentation = "https://github.com/jddevtime/open-lakehouse-compute-fabric/tree/main/docs"
Source = "https://github.com/jddevtime/open-lakehouse-compute-fabric"
Issues = "https://github.com/jddevtime/open-lakehouse-compute-fabric/issues"
Changelog = "https://github.com/jddevtime/open-lakehouse-compute-fabric/blob/main/CHANGELOG.md"

[project.scripts]
olcf = "olcf.cli.main:main"
olcf-worker = "olcf.worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/olcf"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "olcf/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 300
markers = [
  "spark: requires a local Spark runtime (serialised, slow)",
  "postgres: requires a PostgreSQL server",
  "e2e: browser based end-to-end tests",
  "live: requires live external systems (Fabric, OneLake) - never run in CI by default",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "sdk/fabric"]
# the lineage corpus holds notebooks that are INPUT of the analyzers (they use `spark`, `notebookutils` and magics on purpose); they are not code of this project
extend-exclude = ["tests/corpus/lineage"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "S603", "S607", "E501", "B008", "S110"]
